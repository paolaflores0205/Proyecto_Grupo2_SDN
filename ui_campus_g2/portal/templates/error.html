<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso no completado · Campus Virtual Universitario</title>
  <link rel="stylesheet" href="/static/portal.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-crest">CV</div>
      <div class="brand-title">
        <strong>Campus Virtual Universitario</strong>
        <small>Facultad de Ciencias e Ingeniería · Semestre 2026-2</small>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="card card-login card-centered">
      <p class="eyebrow">Aviso del sistema</p>
      <h1>Solicitud no completada</h1>
      <p class="error" role="alert">{{ message }}</p>
      <p>Vuelve al inicio para reintentar tu acceso al Campus Virtual.</p>
      <a class="btn" href="/">Volver al inicio de sesión</a>
    </section>
  </main>
  <footer>Campus Virtual Universitario · Semestre 2026-2</footer>
</body>
</html>
